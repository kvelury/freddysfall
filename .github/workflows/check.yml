name: Check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot 4.7.2 and web export templates
        uses: solarlabyrinth/action-setup-godot@d9f6c080367bc8e35dd623433be29e9f59f53a87 # v3
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Confirm the Godot version
        run: godot --version | grep -E '^4\.7\.2\.'

      - name: Run tests, validate the world, and build the web export
        run: ./tools/check.sh
